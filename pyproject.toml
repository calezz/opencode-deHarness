# Only the deharness ships from this repo. Everything it needs is inside
# deharness/ (stdlib + requests). No pool, no gateway, no tkinter.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-deharness"
version = "0.1.0"
description = "OpenCode deHarness: use the opencode provider from Python, shaped exactly like the desktop client. No harness, no login."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
socks = ["PySocks>=1.7"]

[tool.setuptools]
packages = ["deharness"]

[tool.setuptools.package-data]
deharness = ["template-main-body.json"]
