name: Protocol Sync

on:
  schedule:
    # Daily at 03:00 UTC — catches upstream changes early
    - cron: "0 3 * * *"
  workflow_dispatch:  # manual trigger
  push:
    paths:
      - "scripts/generate_client.py"
      - "tests/integration_test.py"

permissions:
  contents: write  # needed to commit generated/

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deharness in dev mode
        run: |
          pip install -e ./deharness
          pip install openapi-python-client

      - name: Generate client from OpenAPI spec
        run: |
          python scripts/generate_client.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet deharness/generated/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated client
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "opencode-bot"
          git config user.email "bot@opencode.ai"
          git add deharness/generated/
          git commit -m "chore(deharness): sync protocol from OpenCode OpenAPI $(date -u +%Y-%m-%d)"
          git push